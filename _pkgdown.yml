url: https://gillescolling.com/corrselect/
template:
  bootstrap: 5
  bootswatch: sandstone
  light-switch: yes
  math-rendering: mathjax
  includes:
    in_header: |
      <script>
      (function () {
        var D = String.fromCharCode(36);
        window.MathJax = {
          tex: {
            inlineMath: [[D, D], ["\\(", "\\)"]],
            displayMath: [[D + D, D + D], ["\\[", "\\]"]]
          },
          chtml: { linebreaks: { automatic: true, width: "90% container" } },
          svg: { linebreaks: { automatic: true, width: "90% container" } },
          options: { renderActions: { addMenu: [] } }
        };
      })();
      </script>
figures:
  dev: svg
  fig.ext: svg
  bg: '#F5F6F8'
home:
  title: 'corrselect: Correlation-Based Variable Selection in R'
  description: |
    Graph-theoretic algorithms for removing redundant predictors based on pairwise correlation or association thresholds.
authors:
  Gilles Colling:
    href: https://github.com/gcol33
navbar:
  structure:
    left:
    - intro
    - reference
    - articles
    - news
    right:
    - search
    - github
    - lightswitch
  components:
    intro:
      text: Get started
      href: articles/quickstart.html
    github:
      icon: fab fa-github
      href: https://github.com/gcol33/corrselect
      aria-label: GitHub
reference:
- title: High-Level Pruning
  desc: Main functions for predictor pruning
  contents:
  - corrPrune
  - modelPrune
- title: Exact Subset Enumeration
  desc: Graph-theoretic algorithms for exhaustive search
  contents:
  - corrSelect
  - assocSelect
  - MatSelect
- title: Utility Functions
  desc: Helper functions for working with results
  contents:
  - CorrCombo
  - as.data.frame.CorrCombo
  - corrSubset
  - corrselect-package
- title: Example Datasets
  desc: Realistic datasets for vignettes
  contents:
  - bioclim_example
  - survey_example
  - genes_example
  - longitudinal_example
  - cor_example
articles:
- title: Get started
  contents:
  - quickstart
- title: Practical guides
  navbar: Practical guides
  contents:
  - workflows
  - comparison
- title: Advanced
  navbar: Advanced
  contents:
  - advanced
  - theory
footer:
  structure:
    left: developed_by
    right: built_with
